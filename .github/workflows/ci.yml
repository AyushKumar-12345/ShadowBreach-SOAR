name: ShadowBreach SOAR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-simulate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests

    - name: Execute Attack Simulation
      run: |
        python simulate_attack.py

    - name: Execute SOAR Orchestrator Cycle
      run: |
        python run_soar.py

    - name: Verify Incident Artifacts
      run: |
        ls -la data/reports/
        ls -la data/quarantine/
        test -n "$(ls -A data/reports/*.md 2>/dev/null)" || (echo "No MD report generated" && exit 1)